<title>OntoPortal Alliance Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f6f8;display:flex;flex-direction:column;align-items:center;padding:24px 16px 36px;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
#wrap{max-width:100%;border-radius:10px;overflow:hidden;border:1px solid #d8dde5}
canvas{display:block}
.hint{font-size:.72rem;color:#8898aa;margin-top:14px;text-align:center}
</style>

<div id="wrap"><canvas id="c" width="1400" height="1000"></canvas></div>
<p class="hint">Right-click the diagram → Save Image As to export as PNG</p>

<script>
// r = spoke radius, nr = node radius, FR = federation ring gap
const FR=9, CX=700, CY=505;

const PORTALS = [
  // Federation portals — inner ring, bigger circles
  {name:"AgroPortal",      lines:["AgroPortal"],         domain:"Agri-food & Agronomy",  org:"INRAE",            color:"#31b403",status:"production",fed:true, angle:15,  r:285,nr:60},
  {name:"EarthPortal",     lines:["EarthPortal"],         domain:"Earth Sciences",         org:"CNRS · Data Terra",color:"#2a3daa",status:"production",fed:true, angle:48,  r:285,nr:60},
  {name:"EcoPortal",       lines:["EcoPortal"],           domain:"Ecology",                org:"LifeWatch ERIC",   color:"#0d508a",status:"production",fed:true, angle:78,  r:285,nr:60},
  {name:"BiodivPortal",    lines:["Biodiv","Portal"],     domain:"Biodiversity",           org:"GFBio · InfAI",    color:"#33691B",status:"production",fed:true, angle:108, r:285,nr:60},
  // Non-federated production — outer ring
  {name:"BioPortal",       lines:["BioPortal"],           domain:"Biomedical Ontologies",  org:"NCBO · Stanford",  color:"#234979",status:"production",fed:false,angle:138, r:375,nr:54},
  {name:"MedPortal",       lines:["MedPortal"],           domain:"Chinese Biomedicine",    org:"BMICC",            color:"#1a5276",status:"production",fed:false,angle:162, r:375,nr:54},
  {name:"MatPortal",       lines:["MatPortal"],           domain:"Materials Science",       org:"BAM · Fraunhofer", color:"#009574",status:"production",fed:false,angle:188, r:375,nr:54},
  {name:"TechnoPortal",    lines:["Techno","Portal"],     domain:"Technology Sciences",    org:"HES-SO",           color:"#9C4E81",status:"production",fed:false,angle:214, r:375,nr:54},
  {name:"OntoPortal Astro",lines:["OntoPortal","Astro"],  domain:"Astronomy",              org:"Obs Paris",        color:"#624ECF",status:"production",fed:false,angle:240, r:375,nr:54},
  // Retired — mid ring
  {name:"SIFR BioPortal",  lines:["SIFR","BioPortal"],   domain:"French Biomedicine",     org:"LIRMM · INRIA",    color:"#74a9cb",status:"retired",   fed:false,angle:262, r:325,nr:52},
  {name:"IndustryPortal",  lines:["Industry","Portal"],   domain:"Industry",               org:"ENIT",             color:"#4040a0",status:"retired",   fed:false,angle:284, r:325,nr:52},
  // Coming — mid-outer ring
  {name:"SocioPortal",     lines:["Socio","Portal"],      domain:"Social Sciences",        org:"CESSDA",           color:"#556080",status:"coming",    fed:false,angle:306, r:350,nr:46},
  {name:"CHPortal",        lines:["CHPortal"],            domain:"Cultural Heritage",      org:"ECHOES",           color:"#556080",status:"coming",    fed:false,angle:321, r:350,nr:46},
  {name:"HSPortal",        lines:["HSPortal"],            domain:"Heritage Science",       org:"E-RHIS",           color:"#556080",status:"coming",    fed:false,angle:336, r:350,nr:46},
  {name:"LovPortal",       lines:["LovPortal"],           domain:"Web Vocabularies",       org:"",                 color:"#556080",status:"coming",    fed:false,angle:351, r:350,nr:46},
];

function rad(d){return d*Math.PI/180}
function pos(p){const a=rad(p.angle-90);return[CX+p.r*Math.cos(a),CY+p.r*Math.sin(a)]}
function desat(hex,f){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const gr=.299*r+.587*g+.114*b;
  return`rgb(${Math.round(r+(gr-r)*f)},${Math.round(g+(gr-g)*f)},${Math.round(b+(gr-b)*f)})`;
}
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function wrap(ctx,text,maxW){
  const words=text.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}

function draw(){
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;

  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);

  // Subtle concentric guide rings
  ctx.save();
  [100,200,285,375].forEach(rr_=>{
    ctx.beginPath();ctx.arc(CX,CY,rr_,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,0.045)';ctx.lineWidth=1;ctx.stroke();
  });
  ctx.restore();

  // Federation sector highlight
  const fedA=PORTALS.filter(p=>p.fed).map(p=>p.angle);
  const faS=Math.min(...fedA)-16, faE=Math.max(...fedA)+16;
  const fedMaxR=285+60+FR+22; // r + nr + ring + margin
  ctx.save();
  ctx.beginPath();ctx.moveTo(CX,CY);
  ctx.arc(CX,CY,fedMaxR,rad(faS-90),rad(faE-90));ctx.closePath();
  ctx.fillStyle='rgba(232,168,32,0.07)';ctx.fill();
  ctx.beginPath();ctx.arc(CX,CY,fedMaxR-2,rad(faS-90),rad(faE-90));
  ctx.strokeStyle='rgba(232,168,32,0.28)';ctx.lineWidth=1;ctx.stroke();
  const faMid=rad((faS+faE)/2-90);
  const flr=fedMaxR+18;
  ctx.font='600 9.5px Syne,sans-serif';ctx.fillStyle='rgba(180,120,10,0.7)';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('FEDERATION',CX+flr*Math.cos(faMid),CY+flr*Math.sin(faMid));
  ctx.restore();

  // Spokes
  for(const p of PORTALS){
    const [x,y]=pos(p);
    const dx=x-CX,dy=y-CY,dist=Math.sqrt(dx*dx+dy*dy);
    const sx=CX+(dx/dist)*74, sy=CY+(dy/dist)*74;
    const ex=x-(dx/dist)*(p.nr+1), ey=y-(dy/dist)*(p.nr+1);
    ctx.save();
    ctx.strokeStyle=p.status==='production'?p.color:p.status==='retired'?desat(p.color,.4):'#aab8c8';
    ctx.lineWidth=p.status==='production'?1.5:1;
    ctx.globalAlpha=p.status==='production'?.75:p.status==='retired'?.45:.4;
    ctx.setLineDash(p.status==='retired'?[7,5]:p.status==='coming'?[2,4]:[]);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.restore();
  }

  drawHub(ctx);
  for(const p of PORTALS){const[x,y]=pos(p);drawNode(ctx,p,x,y);}
  drawLegend(ctx,W,H);
  drawTitle(ctx);

  ctx.save();
  ctx.font='400 11px DM Sans,sans-serif';
  ctx.fillStyle='rgba(80,100,130,0.45)';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('ontoportal.org',W/2,H-14);
  ctx.restore();
}

function drawHub(ctx){
  const g=ctx.createRadialGradient(CX,CY,28,CX,CY,100);
  g.addColorStop(0,'rgba(24,184,172,0.12)');g.addColorStop(1,'rgba(24,184,172,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,100,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(CX,CY,72,0,Math.PI*2);
  ctx.fillStyle='#18b8ac';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';
  ctx.font='700 15px Syne,sans-serif';ctx.fillText('OntoPortal',CX,CY-14);
  ctx.font='700 13px Syne,sans-serif';ctx.fillText('Alliance',CX,CY+2);
  ctx.font='400 10px DM Sans,sans-serif';ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('15 portals',CX,CY+18);
}

function drawNode(ctx,p,x,y){
  ctx.save();
  const NR=p.nr;
  const retired=p.status==='retired', coming=p.status==='coming';

  if(p.fed){
    ctx.beginPath();ctx.arc(x,y,NR+FR,0,Math.PI*2);
    ctx.strokeStyle='#e8a820';ctx.lineWidth=2.5;ctx.setLineDash([]);ctx.globalAlpha=.82;ctx.stroke();
    ctx.globalAlpha=1;
  }

  ctx.beginPath();ctx.arc(x,y,NR,0,Math.PI*2);
  if(coming){
    ctx.fillStyle='#f0f4f8';ctx.fill();
    ctx.strokeStyle='#aab8cc';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
  } else {
    ctx.fillStyle=retired?desat(p.color,.52):p.color;ctx.fill();
    if(retired){
      ctx.save();ctx.clip();
      ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=4;
      for(let i=-NR*2;i<NR*2;i+=9){ctx.beginPath();ctx.moveTo(x-NR+i,y-NR);ctx.lineTo(x-NR+i+NR*2,y+NR);ctx.stroke();}
      ctx.restore();
    }
    ctx.strokeStyle=retired?'rgba(255,255,255,0.07)':'rgba(255,255,255,0.14)';
    ctx.lineWidth=1.5;ctx.setLineDash([]);ctx.stroke();
  }

  const nc=coming?'#7a8ea8':retired?'rgba(160,175,195,0.8)':'#fff';
  const dc=coming?'#8898b0':retired?'rgba(140,160,185,0.7)':'rgba(255,255,255,0.82)';
  const oc=coming?'#6a7e98':retired?'rgba(120,140,170,0.6)':'rgba(255,255,255,0.6)';

  const maxW=NR*1.68;
  ctx.textAlign='center';ctx.textBaseline='middle';

  ctx.font='italic 400 9px DM Sans,sans-serif';
  const domL=wrap(ctx,p.domain,maxW);
  const hasOrg=p.org.length>0;

  const nFsize=NR>=58?12.5:NR>=54?12:11;
  const nLh=NR>=58?14.5:13.5, dLh=NR>=54?11.5:10.5, oLh=NR>=54?10.5:9.5, gap=2.5;
  const totH=p.lines.length*nLh+gap+domL.length*dLh+(hasOrg?gap+oLh:0);
  let ty=y-totH/2+nLh/2;

  ctx.font=`700 ${nFsize}px Syne,sans-serif`;ctx.fillStyle=nc;
  for(const l of p.lines){ctx.fillText(l,x,ty);ty+=nLh;}
  ty+=gap;
  ctx.font='italic 400 9px DM Sans,sans-serif';ctx.fillStyle=dc;
  for(const l of domL){ctx.fillText(l,x,ty);ty+=dLh;}
  if(hasOrg){ty+=gap;ctx.font='400 9px DM Sans,sans-serif';ctx.fillStyle=oc;ctx.fillText(p.org,x,ty);}

  if(retired||coming){
    const bt=retired?'RETIRED':'COMING';
    const bw=50,bh=13,bx=x-25,by=y+NR-bh-4;
    rrect(ctx,bx,by,bw,bh,3);
    ctx.fillStyle=retired?'rgba(160,55,55,0.9)':'rgba(45,85,150,0.9)';ctx.fill();
    ctx.font='600 8px DM Sans,sans-serif';ctx.fillStyle='rgba(255,255,255,0.88)';
    ctx.fillText(bt,x,by+bh/2);
  }
  ctx.restore();
}

function drawLegend(ctx,W,H){
  const lx=W-218,ly=H-218;
  rrect(ctx,lx-14,ly-14,210,204,8);
  ctx.fillStyle='rgba(248,250,252,0.96)';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;ctx.stroke();
  ctx.font='700 10px Syne,sans-serif';ctx.fillStyle='#6a7a90';
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('LEGEND',lx,ly);
  const items=[
    {label:'Production',draw:(x,y)=>{ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fillStyle='#18b8ac';ctx.fill();}},
    {label:'Retired',draw:(x,y)=>{
      ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fillStyle=desat('#607090',.5);ctx.fill();
      ctx.save();ctx.clip();ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2.5;
      for(let i=-18;i<18;i+=5){ctx.beginPath();ctx.moveTo(x-9+i,y-9);ctx.lineTo(x-9+i+18,y+9);ctx.stroke();}
      ctx.restore();
    }},
    {label:'Coming soon',draw:(x,y)=>{ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.strokeStyle='#2a3852';ctx.lineWidth=1.5;ctx.setLineDash([3,2]);ctx.stroke();ctx.setLineDash([]);}},
    {label:'Federation member',draw:(x,y)=>{ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.strokeStyle='#e8a820';ctx.lineWidth=2.5;ctx.stroke();}},
  ];
  let iy=ly+28;
  for(const item of items){
    ctx.save();item.draw(lx+11,iy);ctx.restore();
    ctx.font='400 12px DM Sans,sans-serif';ctx.fillStyle='#2a3a50';
    ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(item.label,lx+28,iy);
    iy+=30;
  }
  ctx.font='italic 400 10px DM Sans,sans-serif';ctx.fillStyle='#8898aa';
  ctx.fillText('Gold arc = federated cluster',lx,iy+6);
}

function drawTitle(ctx){
  ctx.save();
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='800 18px Syne,sans-serif';ctx.fillStyle='#18b8ac';
  ctx.fillText('ONTOPORTAL ALLIANCE',34,34);
  ctx.font='400 12px DM Sans,sans-serif';ctx.fillStyle='#5a6e86';
  ctx.fillText('Semantic Artefact Catalogue Ecosystem',34,58);
  ctx.font='400 11px DM Sans,sans-serif';ctx.fillStyle='#8898aa';
  ctx.fillText('September 2026',34,76);
  ctx.restore();
}

function resize(){
  const c=document.getElementById('c');
  const w=Math.min(document.getElementById('wrap').clientWidth||1400,1400);
  c.style.width=w+'px';c.style.height=Math.round(w*1000/1400)+'px';
}

document.fonts.ready.then(()=>{draw();resize();});
window.addEventListener('resize',resize);
</script>
